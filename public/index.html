<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sfida matematica · Equazioni e parabole</title><style>
:root{font-family:system-ui,Arial;background:#10152b;color:#f5f7ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:22px}h1{font-size:clamp(25px,4vw,48px);margin:8px 0 14px}h2{font-size:clamp(22px,3vw,35px)}p{line-height:1.5}.muted{color:#b6bfdc}.card{background:#202a48;border:1px solid #3b496e;border-radius:20px;padding:22px;margin:15px 0}.center{text-align:center}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}input{padding:13px;border:1px solid #68769b;border-radius:12px;background:#10182e;color:white;font-size:18px;max-width:100%}button{cursor:pointer;background:#6b55f5;color:white;border:0;padding:14px 21px;border-radius:13px;font-size:17px;font-weight:700}button:disabled{opacity:.4;cursor:default}.alt{background:#344364}.pill{background:#3a4670;padding:8px 13px;border-radius:999px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.answer{min-height:100px;text-align:left;display:flex;gap:12px;align-items:center;font-size:clamp(17px,2.3vw,26px);padding:19px}.answer:nth-child(4n+1){background:#d93d56}.answer:nth-child(4n+2){background:#2475d5}.answer:nth-child(4n+3){background:#bd8420}.answer:nth-child(4n+4){background:#259978}.answer.selected{outline:5px solid white}.answer .graph{width:100%;margin:8px auto}.answer span{min-width:0}.answer.good{outline:5px solid #aaffb7}.answer.bad{opacity:.45}.symbol{font-size:29px}.graph{display:block;margin:12px auto;max-width:100%;width:480px;background:#fff;border-radius:12px}.barrow{display:grid;grid-template-columns:minmax(80px,1fr) 3fr 55px;align-items:center;gap:10px;margin:13px 0}.bar{height:26px;background:#354160;border-radius:7px;overflow:hidden}.bar span{display:block;height:100%;background:#8b7aff}.correct .bar span{background:#3cd69d}.big{font-size:clamp(26px,5vw,60px);font-weight:900}.qr{background:white;padding:10px;border-radius:12px;width:200px;height:200px}.timer{font-size:28px;font-weight:900;color:#ffdd8a}.rank{padding:12px;border-bottom:1px solid #415076}.hide{display:none!important}@media(max-width:650px){.answers{grid-template-columns:1fr}.answer{min-height:72px}.wrap{padding:12px}.barrow{grid-template-columns:1fr 2fr 35px}}
</style></head><body><main class="wrap"><div class="row between"><div><div class="pill" style="display:inline-block">MATEMATICA • SFIDA LIVE</div><h1>Equazioni & parabole</h1></div><div id="status" class="pill">Connessione...</div></div><div id="teacherLogin" class="card center hide"><h2>Accesso docente</h2><p>Inserisci la password docente (per la prova locale: docente123).</p><input id="password" type="password" placeholder="Password docente"><button onclick="teacherLogin()">Apri regia</button><p id="teacherError"></p></div><div id="studentLogin" class="card center hide"><h2>Entra nella partita</h2><div class="row" style="justify-content:center"><input id="pin" inputmode="numeric" placeholder="PIN partita"><input id="nickname" maxlength="22" placeholder="Nickname"></div><p><button onclick="join()">Partecipa</button></p><p id="studentError"></p></div><div id="teacher" class="hide"><div id="teacherBody"></div></div><div id="student" class="hide"><div id="studentBody"></div></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let role='',state=null,reveal=null,myId=sessionStorage.getItem('quizPlayerId'),myName=sessionStorage.getItem('quizPlayerName'),chosen=null,teacherAuthenticated=false;
function show(id){['teacherLogin','studentLogin','teacher','student'].forEach(x=>$(x).classList.toggle('hide',x!==id));}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function teacherLogin(){socket.emit('host:login',$('password').value,r=>{if(!r.ok){$('teacherError').textContent=r.error;return;}teacherAuthenticated=true;role='teacher';show('teacher');render();});}
function join(){socket.emit('player:join',{name:$('nickname').value,code:$('pin').value,id:myId},r=>{if(!r.ok){$('studentError').textContent=r.error;return;}myId=r.id;myName=r.name;sessionStorage.setItem('quizPlayerId',myId);sessionStorage.setItem('quizPlayerName',myName);role='student';show('student');render();});}
function pick(i){if(chosen!==null)return;socket.emit('player:answer',i,r=>{if(r?.ok){chosen=i;render();}});}
socket.on('connect',()=>{$('status').textContent='● Online';if(role==='teacher'&&teacherAuthenticated){teacherAuthenticated=false;role='';show('teacherLogin');$('teacherError').textContent='Connessione ripristinata: inserisci di nuovo la password.';}else if(role==='student'&&myId){socket.emit('player:join',{name:myName,code:(state?.pin||pinFromUrl),id:myId},r=>{if(r?.ok){role='student';show('student');}else{$('studentError').textContent=r?.error||'Impossibile rientrare';role='';show('studentLogin');}});}});socket.on('disconnect',()=>{$('status').textContent='○ Riconnessione...';});
socket.on('state',s=>{if(state?.index!==s.index){chosen=null;reveal=null;}state=s;if(s.phase==='reveal')reveal=s.revealData;render();});socket.on('reveal',r=>{reveal=r;render();});
function graphSVG(g){if(!g)return '';let w=480,h=250,xmin=-4.5,xmax=4.5,ymin=-5.5,ymax=5.5,X=x=>(x-xmin)/(xmax-xmin)*w,Y=y=>(ymax-y)/(ymax-ymin)*h;let p='';for(let i=0;i<=220;i++){let x=xmin+(xmax-xmin)*i/220,y=g.a*x*x+g.b*x+g.c;p+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)+' ';}let grid='';for(let i=-4;i<=4;i++)grid+=`<line x1="${X(i)}" x2="${X(i)}" y1="0" y2="${h}" stroke="#e5e9ef"/><text x="${X(i)+3}" y="${Y(0)+15}" font-size="12" fill="#536071">${i||''}</text>`;for(let i=-5;i<=5;i++)grid+=`<line x1="0" x2="${w}" y1="${Y(i)}" y2="${Y(i)}" stroke="#e5e9ef"/>`;return `<svg class="graph" viewBox="0 0 ${w} ${h}" role="img" aria-label="Grafico di una parabola nel piano cartesiano">${grid}<line x1="0" y1="${Y(0)}" x2="${w}" y2="${Y(0)}" stroke="#34425a" stroke-width="2"/><line x1="${X(0)}" y1="0" x2="${X(0)}" y2="${h}" stroke="#34425a" stroke-width="2"/><path d="${p}" fill="none" stroke="#6244d5" stroke-width="4"/><text x="${w-16}" y="${Y(0)-8}" fill="#34425a">x</text><text x="${X(0)+9}" y="18" fill="#34425a">y</text></svg>`;}
function options(q,interactive){return `<div class="answers">${q.options.map((o,i)=>`<button class="answer ${chosen===i?'selected':''}" ${interactive&&chosen===null?'':'disabled'} ${interactive?`onclick="pick(${i})"`:''}><span class="symbol">${['▲','◆','●','■'][i]}</span><span style="display:block;min-width:0;width:100%">${esc(o)}${q.optionGraphs?.[i]?graphSVG(q.optionGraphs[i]):''}</span></button>`).join('')}</div>`;}
function results(){if(!reveal)return '<p>Elaborazione risultati...</p>';let q=state.question,total=reveal.counts.reduce((a,b)=>a+b,0);return `<div class="card"><h2>Risultati della domanda</h2>${q.options.map((o,i)=>`<div class="barrow ${i===reveal.correct?'correct':''}"><div>${['▲','◆','●','■'][i]} ${esc(o)} ${i===reveal.correct?'✓':''}</div><div class="bar"><span style="width:${total?100*reveal.counts[i]/total:0}%"></span></div><strong>${reveal.counts[i]} (${total?Math.round(100*reveal.counts[i]/total):0}%)</strong></div>`).join('')}<p><strong>Spiegazione:</strong> ${esc(reveal.explain)}</p></div>`;}
function ranking(){let ps=(reveal?.players||state.players.slice().sort((a,b)=>b.score-a.score));return `<div class="card"><h2>🏆 Classifica</h2>${ps.map((p,i)=>`<div class="rank">${i+1}. <strong>${esc(p.name)}</strong> — ${p.score} punti</div>`).join('')}</div>`;}
function render(){if(!state||!role)return;let q=state.question;if(role==='teacher'){let url=location.origin+'/join?pin='+state.pin;let qr='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url);$('teacherBody').innerHTML=state.phase==='lobby'?`<div class="card center"><h2>La partita è pronta!</h2><p>Gli studenti inquadrano il QR code oppure aprono il link.</p><img class="qr" alt="QR code di accesso" src="${qr}"><p class="big">PIN ${state.pin}</p><p style="overflow-wrap:anywhere">${esc(url)}</p><p><strong>${state.players.filter(p=>p.connected).length}</strong> studenti collegati</p><p>${state.players.map(p=>esc(p.name)).join(' · ')}</p><button onclick="socket.emit('host:next')">Inizia la sfida</button></div>`:state.phase==='question'?`<div class="card"><div class="row between"><span class="pill">Domanda ${state.index+1}/20 · ${esc(q.type)}</span><span class="timer" id="countdown"></span><span>${state.count}/${state.total} risposte</span></div><h2>${esc(q.text)}</h2>${graphSVG(q.graph)}${options(q,false)}<p class="center"><button onclick="socket.emit('host:reveal')">Chiudi e mostra risultati</button></p></div>`:state.phase==='reveal'?`<div class="card"><span class="pill">Domanda ${state.index+1}/20</span><h2>${esc(q.text)}</h2>${graphSVG(q.graph)}</div>${results()}${ranking()}<div class="center"><button onclick="socket.emit('host:next')">${state.index===19?'Termina la sfida':'Prossima domanda →'}</button></div>`:`<div class="card center"><h2>🎉 Sfida terminata!</h2>${ranking()}<button onclick="socket.emit('host:reset')">Nuova partita</button></div>`;}
else{$('studentBody').innerHTML=state.phase==='lobby'?`<div class="card center"><h2>Benvenuto, ${esc(myName)}!</h2><p>Sei nella partita. Attendi che il docente inizi.</p><p>Partecipanti: ${state.total}</p></div>`:state.phase==='question'?`<div class="card"><div class="row between"><span class="pill">Domanda ${state.index+1}/20</span><span class="timer" id="countdown"></span></div><h2>${esc(q.text)}</h2>${graphSVG(q.graph)}${options(q,true)}${chosen!==null?'<p class="center">✓ Risposta registrata. Attendi i risultati.</p>':''}</div>`:state.phase==='reveal'?`<div class="card center"><h2>Risposta svelata!</h2><p>${esc(q.options[reveal?.correct]||'')}</p></div>${results()}${ranking()}`:`<div class="card center"><h2>🏆 Partita terminata!</h2>${ranking()}</div>`;}}
setInterval(()=>{if(state?.phase==='question'){let el=$('countdown');if(el)el.textContent=Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+' s';}},250);
const pinFromUrl=new URLSearchParams(location.search).get('pin');if(location.pathname==='/join'){role='';if(pinFromUrl)$('pin').value=pinFromUrl;if(myName)$('nickname').value=myName;show('studentLogin');}else{show('teacherLogin');}
</script></body></html>
